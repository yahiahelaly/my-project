<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library - Books and Authors</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container container-wide">
        <div class="todo-card library-card">
            <div class="header">
                <h1>Library</h1>
                <div class="header-actions">
                    <a href="/list" class="btn btn-secondary btn-link">My To-Dos</a>
                    <form action="/logout" method="POST" class="logout-form">
                        <button type="submit" class="btn btn-secondary">Log out</button>
                    </form>
                </div>
            </div>

            <p class="page-error" id="pageError"></p>

            <!-- F2.1 table of books -->
            <section>
                <div class="section-head">
                    <h2>Books</h2>
                    <button type="button" class="btn btn-primary btn-small" id="addBookBtn">Add book</button>
                </div>
                <div class="table-wrap">
                    <table class="data-table" id="booksTable">
                        <thead>
                            <tr><th>Cover</th><th>book_id</th><th>Title</th><th>Price</th><th>author_id</th><th>Actions</th></tr>
                        </thead>
                        <tbody id="booksBody"></tbody>
                    </table>
                </div>
                <div id="booksEmpty" class="empty-state" style="display: none;"><p>No books yet.</p></div>
            </section>

            <!-- F2.1 table of authors -->
            <section>
                <div class="section-head">
                    <h2>Authors</h2>
                    <button type="button" class="btn btn-primary btn-small" id="addAuthorBtn">Add author</button>
                </div>
                <div class="table-wrap">
                    <table class="data-table" id="authorsTable">
                        <thead>
                            <tr><th>Photo</th><th>author_id</th><th>Name</th><th>Country</th><th>Actions</th></tr>
                        </thead>
                        <tbody id="authorsBody"></tbody>
                    </table>
                </div>
                <div id="authorsEmpty" class="empty-state" style="display: none;"><p>No authors yet.</p></div>
            </section>
        </div>
    </div>

    <!-- Add / Edit book -->
    <div id="bookModal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2 id="bookModalTitle">Add Book</h2>
            <form id="bookForm" novalidate>
                <input type="hidden" id="bookId">
                <div class="form-group">
                    <label for="bookTitle">Title</label>
                    <input type="text" id="bookTitle" maxlength="150">
                    <span class="error" id="bookTitleError"></span>
                </div>
                <div class="form-group">
                    <label for="bookPrice">Price</label>
                    <input type="text" id="bookPrice" inputmode="decimal" placeholder="e.g. 12.50">
                    <span class="error" id="bookPriceError"></span>
                </div>
                <div class="form-group">
                    <label for="bookAuthor">Author</label>
                    <select id="bookAuthor"></select>
                    <span class="error" id="bookAuthorError"></span>
                </div>
                <div class="form-group">
                    <label for="bookImage">Cover image (optional)</label>
                    <input type="file" id="bookImage" accept="image/jpeg,image/png,image/gif,image/webp">
                    <span class="error" id="bookImageError"></span>
                </div>
                <div class="modal-buttons">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <button type="button" class="btn btn-secondary" id="cancelBook">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Add / Edit author -->
    <div id="authorModal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2 id="authorModalTitle">Add Author</h2>
            <form id="authorForm" novalidate>
                <input type="hidden" id="authorId">
                <div class="form-group">
                    <label for="authorName">Name</label>
                    <input type="text" id="authorName" maxlength="100">
                    <span class="error" id="authorNameError"></span>
                </div>
                <div class="form-group">
                    <label for="authorCountry">Country</label>
                    <input type="text" id="authorCountry" maxlength="50">
                    <span class="error" id="authorCountryError"></span>
                </div>
                <div class="form-group">
                    <label for="authorImage">Photo (optional)</label>
                    <input type="file" id="authorImage" accept="image/jpeg,image/png,image/gif,image/webp">
                    <span class="error" id="authorImageError"></span>
                </div>
                <div class="modal-buttons">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <button type="button" class="btn btn-secondary" id="cancelAuthor">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete confirmation (book or author) -->
    <div id="deleteModal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2 id="deleteTitle">Delete</h2>
            <p id="deleteMessage">Are you sure?</p>
            <div class="modal-buttons">
                <button type="button" class="btn btn-danger" id="confirmDelete">Delete</button>
                <button type="button" class="btn btn-secondary" id="cancelDelete">Cancel</button>
            </div>
        </div>
    </div>

    <script src="library.js"></script>
</body>
</html>
